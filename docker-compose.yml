# Bancos de desenvolvimento do back-office.
#
# Só os bancos sobem aqui (Oracle e MongoDB) — a aplicação roda no terminal
# (`dotnet run`), onde o log fica visível e o restart é imediato.
#
#   docker compose up -d          sobe o banco
#   docker compose down -v        derruba e APAGA o volume
#
# A porta é 1522: o serviço de cuidado usa 1521, e os dois bancos são separados
# desde o ADR s3-25 — nenhum objeto de um existe no schema do outro.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: petbuddies-oracle-backoffice
    ports:
      - "${ORACLE_PORT:-1522}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle}
      APP_USER: ${ORACLE_USER:-PETBUDDIES}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-petbuddies}
    volumes:
      - oracle-backoffice:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Memória de cálculo dos pontos (coleção memorias_calculo). Sem autenticação:
  # só para desenvolvimento, na porta padrão que o appsettings.json já espera.
  mongo:
    image: mongo:7.0
    container_name: petbuddies-mongo-backoffice
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-backoffice:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-backoffice:
  mongo-backoffice:
